<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>카메라</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #video.front{transform:scaleX(-1)}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;
       padding:20px 16px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55))}
  #shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
  #shutter:active{background:#fff}
  .side{width:56px;height:56px;border-radius:12px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.35);
        color:#fff;font-size:24px;padding:0;overflow:hidden}
  #thumb{display:none;width:100%;height:100%;object-fit:cover}
  #msg{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
       background:rgba(0,0,0,.65);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #msg.show{opacity:1}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.6;background:#111}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="flash"></div>
<div id="msg"></div>
<div id="err"></div>
<div class="bar">
  <button class="side" id="last" aria-label="마지막 사진"><img id="thumb" alt=""></button>
  <button id="shutter" aria-label="촬영"></button>
  <button class="side" id="flip" aria-label="전환">🔄</button>
</div>

<script>
const video = document.getElementById('video');
const msg = document.getElementById('msg');
const err = document.getElementById('err');
const thumb = document.getElementById('thumb');
let facing = 'environment';
let stream = null;
let lastBlob = null, lastName = '';

function toast(t){
  msg.textContent = t; msg.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(()=>msg.classList.remove('show'), 1800);
}

async function start(){
  if (stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    video.srcObject = stream;
    video.classList.toggle('front', facing==='user');
    err.style.display='none';
  }catch(e){
    err.style.display='flex';
    err.innerHTML = '카메라를 사용할 수 없어요.<br>브라우저의 카메라 권한을 허용해주세요.<br>(https 주소에서만 동작해요)';
  }
}

function pad(n){return String(n).padStart(2,'0')}
function fileName(){
  const d = new Date();
  return `photo_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
}

async function saveBlob(blob, name){
  const file = new File([blob], name, {type:'image/jpeg'});
  // 폰: 공유창에서 "이미지 저장"으로 사진첩에 저장
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  // PC 등: 다운로드
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

async function shoot(){
  if (!video.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  const ctx = c.getContext('2d');
  if (facing==='user'){ ctx.translate(c.width,0); ctx.scale(-1,1); }
  ctx.drawImage(video,0,0,c.width,c.height);

  const f = document.getElementById('flash');
  f.style.transition='none'; f.style.opacity='.8';
  requestAnimationFrame(()=>{ f.style.transition='opacity .25s'; f.style.opacity='0'; });

  c.toBlob(async blob=>{
    lastBlob = blob; lastName = fileName();
    thumb.src = URL.createObjectURL(blob); thumb.style.display='block';
    document.getElementById('last').textContent='';
    document.getElementById('last').appendChild(thumb);
    await saveBlob(blob, lastName);
  }, 'image/jpeg', 0.92);
}

document.getElementById('shutter').onclick = shoot;
document.getElementById('flip').onclick = ()=>{ facing = facing==='user'?'environment':'user'; start(); };
document.getElementById('last').onclick = ()=>{ if(lastBlob) saveBlob(lastBlob,lastName); else toast('아직 찍은 사진이 없어요'); };

start();
</script>
</body>
</html>
